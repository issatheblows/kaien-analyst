<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>kaien analyst</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { width: 300px; padding: 14px; }
  .brand { font-size: 17px; }
  .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .mini .kpi { padding: 10px 12px; }
  .mini .kpi-value { font-size: 20px; margin-top: 4px; }
  .stack { display: grid; gap: 6px; }
  .stack button { width: 100%; }
</style>
</head>
<body>
  <div class="brand"><span class="logo" aria-hidden="true">◆</span> kaien analyst</div>
  <div class="mini">
    <div class="kpi"><div class="kpi-label">В базе</div><div id="p-posts" class="kpi-value">—</div></div>
    <div class="kpi"><div class="kpi-label">Сегодня</div><div id="p-sent" class="kpi-value accent">—</div></div>
    <div class="kpi"><div class="kpi-label">Режим</div><div id="p-mode" class="kpi-value" style="font-size:13px">—</div></div>
    <div class="kpi"><div class="kpi-label">Автопилот</div><div id="p-auto" class="kpi-value" style="font-size:13px">—</div></div>
  </div>
  <div class="stack">
    <button id="p-dashboard" class="primary" type="button">Открыть дашборд</button>
    <button id="p-find" type="button">Найти финансовые видео в X</button>
    <button id="p-stop" class="danger" type="button">Аварийная остановка</button>
  </div>
  <script src="domain.js"></script>
  <script src="popup.js"></script>
</body>
</html>
